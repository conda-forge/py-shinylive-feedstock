schema_version: 1

context:
  version: "0.8.12"

package:
  name: py-shinylive
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/shinylive/shinylive-${{ version }}.tar.gz
  sha256: cb5c7a1505fb447dea8c1cbf93f57ec72dc5d092eaf4c441ddc754d3c1b7cac1

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - shinylive = shinylive._main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - shiny
    - click >=8.1.7
    - appdirs >=1.4.4
    - lzstring >=1.0.4
    - typing_extensions >=4.0.1
    - chevron >=0.14.0

tests:
  - python:
      imports:
        - shinylive
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
    script:
      - shinylive --help

about:
  summary: Run Shiny applications running Python in the browser.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/posit-dev/py-shinylive
  documentation: https://github.com/posit-dev/py-shinylive
  repository: https://github.com/posit-dev/py-shinylive

extra:
  recipe-maintainers:
    - schloerke
